<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Артём Алексашин — Python, автоматизация, интеграции, IoT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101c33"/>
      <stop offset="1" stop-color="#0e2a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#dots)"/>

  <!-- «схема»: узлы и линии справа -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.55">
    <path d="M820 70 H900 V140 H980"/>
    <path d="M900 140 V210 H1040"/>
    <path d="M980 140 H1060 V70 H1120"/>
  </g>
  <g fill="#0b1220" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="820" cy="70" r="9"/>
    <circle cx="980" cy="140" r="9"/>
    <circle cx="1040" cy="210" r="9"/>
    <circle cx="1120" cy="70" r="9"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="820" cy="70" r="3.5"/>
    <circle cx="980" cy="140" r="3.5"/>
    <circle cx="1040" cy="210" r="3.5"/>
    <circle cx="1120" cy="70" r="3.5"/>
  </g>

  <text x="64" y="128" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc">Артём Алексашин</text>
  <rect x="66" y="148" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#cbd5e1">Python · Автоматизация · Интеграции · IoT</text>
  <text x="64" y="234" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#94a3b8">Делаю софт, который решает реальные задачи бизнеса</text>
</svg>
